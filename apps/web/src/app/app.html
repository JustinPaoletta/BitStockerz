<header class="site-header">
  <a class="brand" routerLink="/dashboard" aria-label="BitStockerz home">
    <img class="brand-logo" src="/brand/mark.svg" alt="" width="36" height="36" />
    <span class="brand-wordmark">bitstockerz</span>
  </a>
  @if (auth.isAuthenticated()) {
    <nav aria-label="Primary navigation">
      <a
        routerLink="/dashboard"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        [routerLinkActiveOptions]="{ exact: true }"
        >Dashboard</a
      >
      <a routerLink="/trade" routerLinkActive="active" ariaCurrentWhenActive="page">Trade</a>
      <a routerLink="/strategies" routerLinkActive="active" ariaCurrentWhenActive="page"
        >Strategies</a
      >
      <a routerLink="/backtests" routerLinkActive="active" ariaCurrentWhenActive="page"
        >Backtests</a
      >
    </nav>
    <div class="user-menu">
      <span class="user-label">{{
        auth.user()?.display_name || auth.user()?.email || 'Signed in'
      }}</span>
      <a
        class="button ghost small"
        routerLink="/profile"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        >Account</a
      >
      <button class="button ghost small" type="button" (click)="logout()">Log out</button>
    </div>
  }
</header>
<main>
  <router-outlet />
</main>
