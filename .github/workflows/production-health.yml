name: Production health
on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: read
concurrency:
  group: production-health
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
      - name: Check configured production API
        env:
          API_BASE_URL: ${{ vars.PRODUCTION_API_BASE_URL }}
          PRIVATE_BETA_MONITOR_KEY: ${{ secrets.PRIVATE_BETA_MONITOR_KEY }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "Production monitoring deferred: PRODUCTION_API_BASE_URL is not configured."
            exit 0
          fi
          node scripts/ops/check-health.mjs
