name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  ci-gate:
    name: Reuse CI
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  deploy-api:
    name: Deploy API (Fly.io)
    needs: ci-gate
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Migrate database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npm ci
          npx prisma migrate deploy
          npx prisma migrate status
      - name: Deploy API
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --config fly.toml
      - name: Smoke live/ready
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          set -euo pipefail
          curl -fsS "$API_BASE_URL/api/health/live" | grep -q '"status":"ok"'
          curl -fsS "$API_BASE_URL/api/health/ready" | grep -q '"ready":true'

  deploy-web:
    name: Deploy Web (Vercel)
    needs: deploy-api
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Inject API base URL
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const url = (process.env.API_BASE_URL || '').replace(/\/$/, '');
          const body = `export const environment = {\n  production: true,\n  apiBaseUrl: ${JSON.stringify(url)},\n};\n`;
          fs.writeFileSync('src/environments/environment.prod.ts', body);
          NODE
      - run: npm ci
      - run: npm run build -- --configuration production
      - uses: amondnet/vercel-action@16e87c0a08142b0d0d33b76aeaf20823c381b9b9 # v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: apps/web
          vercel-args: '--prod'
          github-comment: false
